<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>acidUI control example</title>
  <!-- Paths are relative to this template in the acidUI repository. -->
  <link rel="stylesheet" href="../../../src/components.css">
  <script type="module" src="../../../src/components.js"></script>
  <style>
    body { font: 14px system-ui, sans-serif; background: #c9c9bf; padding: 2rem; }
    .panel { display: flex; flex-wrap: wrap; gap: 2rem; align-items: flex-start; }
    .control { display: grid; justify-items: center; gap: .75rem; min-width: 80px; }
    acid-button { width: 50px; }
  </style>
</head>
<body>
  <h1>acidUI controls</h1>
  <div class="panel">
    <div class="control"><span>Cutoff</span><acid-knob id="knob" label="Cutoff" min="0" max="100" step="1" value="50" drag-mode="circular" show-value="always"></acid-knob></div>
    <div class="control"><span>Step</span><acid-button id="button" label="Step" caption="1" color="orange" value="0"></acid-button></div>
    <div class="control"><span>Bypass</span><acid-switch id="switch" label="Bypass" value="0"></acid-switch></div>
    <div class="control"><span>Volume</span><acid-fader id="fader" label="Volume" value="70"></acid-fader></div>
    <div class="control"><span>Level</span><acid-meter id="meter" label="Level" segments="12" value="0.7"></acid-meter><label><input id="clip" type="checkbox"> Clip</label></div>
  </div>
  <p>Last value: <output id="result">—</output></p>
  <script type="module">
    await customElements.whenDefined('acid-knob');
    const result = document.querySelector('#result');
    document.querySelectorAll('acid-knob, acid-button, acid-switch, acid-fader').forEach(control => {
      control.addEventListener('input', event => { result.textContent = `${control.id}: ${event.detail.value}`; });
    });
    document.querySelector('#clip').addEventListener('change', event => {
      document.querySelector('#meter').clip = event.target.checked;
    });
  </script>
</body>
</html>
